    #holidayModal {

    .modal-content {

    }  
    .date-selector {  
      display: flex;  
      justify-content: center;  
      gap: 10px;  
      margin-bottom: 20px;  
    }  
    .date-selector select,  
    .date-selector button {  
      padding: 6px 10px;  
      font-size: 14px;  
    }  
  </style>  
</head>

</div>  <div class="calendar-grid" id="calendar"></div>    </div>  <div id="holidayModal" class="modal">

  { date: "2025-08-16", name: "Janmashtami" },
  { date: "2025-09-05", name: "Milad (Hazrat Muhammad’s Birthday)" },
  { date: "2025-09-29", name: "Durga Puja (Ashtami)" },
  { date: "2025-10-01", name: "Maha Navami (Durga Puja)" },
  { date: "2025-10-02", name: "Vijayadashami / Gandhi Jayanti" },
  { date: "2025-10-22", name: "Diwali" },
  { date: "2025-10-27", name: "Chhath Puja" },

   const calendar = document.getElementById("calendar");  
const monthYear = document.getElementById("monthYear");  
let currentDate = new Date();  
let selectedDateStr = "";  

function renderCalendar(date) {  
  const year = date.getFullYear();  
  const month = date.getMonth();  
  const today = new Date();  
  const firstDay = new Date(year, month, 1).getDay();  
  const daysInMonth = new Date(year, month + 1, 0).getDate();  

  calendar.innerHTML = "";  
  monthYear.textContent = date.toLocaleString('default', { month: 'long', year: 'numeric' });  

  const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];  
  dayNames.forEach(day => {  
    const div = document.createElement("div");  
    div.textContent = day;  
    div.className = "day-header";  
    calendar.appendChild(div);  
  });  

  for (let i = 0; i < firstDay; i++) {  
    const empty = document.createElement("div");  
    calendar.appendChild(empty);  
  }  

  for (let d = 1; d <= daysInMonth; d++) {  
    const dateStr = `${year}-${(month + 1).toString().padStart(2, '0')}-${d.toString().padStart(2, '0')}`;  
    const div = document.createElement("div");  
    div.className = "day";  
    div.textContent = d;  

    const holiday = holidays.find(h => h.date === dateStr);  
    if (holiday) div.classList.add("holiday");  
    if (new Date(dateStr).getDay() === 0) div.classList.add("sunday");  
    if (today.toDateString() === new Date(dateStr).toDateString()) div.classList.add("current-day");  
if (selectedDateStr === dateStr) {
  if (holiday) {
    div.style.backgroundColor = "#34c759"; // green for holidays
    div.style.color = "white";
  } else if (new Date(dateStr).getDay() === 0) {
    div.style.backgroundColor = "#ff4d4d"; // red for Sundays
    div.style.color = "white";
  } else {
    div.style.backgroundColor = "#007bff"; // blue for other dates
    div.style.color = "white";
  }
} 

    div.addEventListener("click", () => {  
      selectedDateStr = dateStr;  
      renderCalendar(currentDate);  
      if (holiday) openModal(`${d} ${date.toLocaleString('default', { month: 'long' })} — ${holiday.name}`);  
      else openModal(`${d} ${date.toLocaleString('default', { month: 'long' })} — No holiday`);  
    });  

    calendar.appendChild(div);  
  }  
}  

function changeMonth(offset) {  
  currentDate.setMonth(currentDate.getMonth() + offset);  
  renderCalendar(currentDate);  
}  

function jumpToDate() {  
  const day = parseInt(document.getElementById("selectDate").value);  
  const month = parseInt(document.getElementById("selectMonth").value);  
  const year = parseInt(document.getElementById("selectYear").value);  
  currentDate = new Date(year, month, 1);  
  selectedDateStr = `${year}-${(month + 1).toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;  
  renderCalendar(currentDate);  
}  

const modal = document.getElementById("holidayModal");  
const modalText = document.getElementById("modalText");  
const closeButton = document.querySelector(".close-button");  

function openModal(text) {  
  modalText.textContent = text;  
  modal.style.display = "block";  
}  

closeButton.onclick = () => modal.style.display = "none";  
window.onclick = event => {  
  if (event.target === modal) modal.style.display = "none";  
};  

function populateDateSelectors() {  
  const dateSelect = document.getElementById("selectDate");  
  const monthSelect = document.getElementById("selectMonth");  
  const yearSelect = document.getElementById("selectYear");  

  for (let d = 1; d <= 31; d++) {  
    const opt = document.createElement("option");  
    opt.value = d;  
    opt.textContent = d;  
    dateSelect.appendChild(opt);  
  }  
  for (let m = 0; m < 12; m++) {  
    const opt = document.createElement("option");  
    opt.value = m;  
    opt.textContent = new Date(2000, m).toLocaleString('default', { month: 'long' });  
    monthSelect.appendChild(opt);  
  }  
  for (let y = 2024; y <= 2026; y++) {  
    const opt = document.createElement("option");  
    opt.value = y;  
    opt.textContent = y;  
    yearSelect.appendChild(opt);  
  }  

  dateSelect.value = currentDate.getDate();  
  monthSelect.value = currentDate.getMonth();  
  yearSelect.value = currentDate.getFullYear();  
}  

populateDateSelectors();  
renderCalendar(currentDate);





function listUpcomingHolidaysAndSundays() {
  const holidayList = document.getElementById("holidayList");
  holidayList.innerHTML = ""; // Clear old list

  const today = new Date();
  const currentMonth = today.getMonth();
  const currentYear = today.getFullYear();

  // Handle December → January next year
  const monthsToShow = [
    { month: currentMonth, year: currentYear },
    { month: (currentMonth + 1) % 12, year: currentMonth === 11 ? currentYear + 1 : currentYear }
  ];

  let listItems = [];

  monthsToShow.forEach(({ month, year }) => {
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${(month + 1).toString().padStart(2, '0')}-${d.toString().padStart(2, '0')}`;
      const currentDate = new Date(dateStr);

      // Only future or today's dates
      if (currentDate >= new Date(today.setHours(0,0,0,0))) {
        const dayOfWeek = currentDate.getDay();
        const holiday = holidays.find(h => h.date === dateStr);

        if (holiday && dayOfWeek === 0) {
          // Holiday + Sunday
          listItems.push({
            date: currentDate,
            name: `Sunday (${holiday.name})`,
            type: "sunday-holiday"
          });
        } else if (holiday) {
          listItems.push({
            date: currentDate,
            name: holiday.name,
            type: "holiday"
          });
        } else if (dayOfWeek === 0) {
          listItems.push({
            date: currentDate,
            name: "Sunday",
            type: "sunday"
          });
        }
      }
    }
  });

  // Sort by date
  listItems.sort((a, b) => a.date - b.date);

  if (listItems.length === 0) {
    holidayList.innerHTML = "<p>No upcoming holidays this or next month.</p>";
    return;
  }

  listItems.forEach(item => {
    const div = document.createElement("div");
    const formattedDate = item.date.toLocaleDateString('en-GB', {
      day: '2-digit',
      month: 'long',
      year: 'numeric'
    });
    div.textContent = `${formattedDate} — ${item.name}`;
    div.style.padding = "5px 0";
    div.style.borderBottom = "1px solid #eee";

    if (item.type === "holiday") {
      div.style.color = "green";
      div.style.fontWeight = "bold";
    } else if (item.type === "sunday") {
      div.style.color = "red";
      div.style.fontWeight = "bold";
    } else if (item.type === "sunday-holiday") {
      div.style.color = "red";
      div.style.fontWeight = "bold";
    }

    holidayList.appendChild(div);
  });
}

listUpcomingHolidaysAndSundays();
